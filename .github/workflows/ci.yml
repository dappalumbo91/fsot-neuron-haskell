name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cabal:
    name: cabal build + test (GHC 9.6.6)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: "9.6.6"   # matches stack.yaml resolver lts-22.43
          cabal-version: latest
      - name: Configure
        run: |
          cabal update
          cabal configure --enable-tests
          cabal build all --dry-run
      - name: Cache cabal store
        uses: actions/cache@v4
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ runner.os }}-ghc-9.6.6-${{ hashFiles('dist-newstyle/cache/plan.json') }}
          restore-keys: ${{ runner.os }}-ghc-9.6.6-
      - name: Build
        run: cabal build all
      - name: Test
        run: cabal test all --test-show-details=direct
